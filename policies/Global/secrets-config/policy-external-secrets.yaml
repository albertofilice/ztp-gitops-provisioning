---
apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: policy-install-external-secrets-operator-global
spec:
  object-templates:
    - complianceType: musthave
      metadataComplianceType: musthave
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: install-external-secrets-operator
          namespace: '{{ fromClusterClaim "name"}}'
        spec:
          complianceType: musthave
          remediationAction: enforce
          severity: critical
          subscription:
            channel: stable
            name: external-secrets-operator
            namespace: openshift-operators
            source: community-operators
            sourceNamespace: openshift-marketplace
            startingCSV: external-secrets-operator.v0.11.0
          upgradeApproval: None
          versions:
            - external-secrets-operator.v0.11.0 
---
apiVersion: operator.external-secrets.io/v1alpha1
kind: OperatorConfig
metadata:
  name: external-secrets-operator-config
  namespace: openshift-operators
spec:
  affinity: {}
  certController:
    affinity: {}
    create: true
    deploymentAnnotations: {}
    extraArgs: {}
    extraEnv: []
    fullnameOverride: ""
    image:
      pullPolicy: IfNotPresent
      repository: ghcr.io/external-secrets/external-secrets
      tag: ""
    imagePullSecrets: []
    nameOverride: ""
    nodeSelector: {}
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {}
    priorityClassName: ""
    prometheus:
      enabled: false
      service:
        port: 8080
    rbac:
      create: true
    requeueInterval: 5m
    resources: {}
    securityContext: {}
    serviceAccount:
      annotations: {}
      create: true
      name: ""
    tolerations: []
  concurrent: 1
  controllerClass: ""
  crds:
    createClusterExternalSecret: true
    createClusterSecretStore: true
  createOperator: true
  deploymentAnnotations: {}
  extraArgs: {}
  extraEnv: []
  fullnameOverride: ""
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/external-secrets/external-secrets
    tag: ""
  imagePullSecrets: []
  installCRDs: false
  leaderElect: false
  nameOverride: ""
  nodeSelector: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  priorityClassName: ""
  processClusterExternalSecret: true
  processClusterStore: true
  prometheus:
    enabled: false
    service:
      port: 8080
  rbac:
