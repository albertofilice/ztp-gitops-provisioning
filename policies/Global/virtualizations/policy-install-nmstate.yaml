apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: policy-install-nmstate-operator-global
spec:
  object-templates:
    - complianceType: musthave
      metadataComplianceType: musthave
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: install-nmstate-operator
          namespace: '{{ fromClusterClaim "name"}}'
        spec:
          complianceType: musthave
          operatorGroup:
            name: default
            targetNamespaces:
              - openshift-nmstate          
          remediationAction: enforce
          severity: critical
          subscription:
            channel: stable
            name: kubernetes-nmstate-operator
            namespace: openshift-nmstate
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            startingCSV: kubernetes-nmstate-operator.4.17.0-202502120148
          upgradeApproval: None
          versions:
            - kubernetes-nmstate-operator.4.17.0-202502120148
---
apiVersion: nmstate.io/v1
kind: NMState
metadata:
  name: nmstate
spec: {}
