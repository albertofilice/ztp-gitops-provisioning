apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: policy-install-file-integrity-global
spec:
  object-templates:
    - complianceType: musthave
      metadataComplianceType: musthave
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: install-file-integrity-operator
          namespace: '{{ fromClusterClaim "name"}}'
        spec:
          complianceType: musthave
          operatorGroup:
            name: default
            targetNamespaces:
              - openshift-file-integrity          
          remediationAction: enforce
          severity: critical
          subscription:
            channel: stable
            name: file-integrity-operator
            namespace: openshift-file-integrity
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            startingCSV: file-integrity-operator.v1.3.5
          upgradeApproval: None
          versions:
            - file-integrity-operator.v1.3.5
---
apiVersion: fileintegrity.openshift.io/v1alpha1
kind: FileIntegrity
metadata:
  name: master-fileintegrity
  namespace: openshift-file-integrity
spec:
  nodeSelector: 
      node-role.kubernetes.io/master: ""
  config: 
    gracePeriod: 90
    maxBackups: 5 
    initialDelay: 60 
  debug: false
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
---      
apiVersion: fileintegrity.openshift.io/v1alpha1
kind: FileIntegrity
metadata:
  name: worker-fileintegrity
  namespace: openshift-file-integrity
spec:
  nodeSelector: 
      node-role.kubernetes.io/worker: ""
  config: 
    gracePeriod: 90
    maxBackups: 5 
    initialDelay: 60 
  debug: false
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
    - effect: NoSchedule
      key: node-role.kubernetes.io/infra
      operator: Exists
    - key: node.ocs.openshift.io/storage
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: elasticnode
      operator: Equal
      value: "true"
      effect: NoSchedule