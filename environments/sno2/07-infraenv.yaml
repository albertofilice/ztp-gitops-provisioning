  cpuArchitecture: x86_64
  ipxeScriptType: DiscoveryImageAlways
  nmStateConfigLabelSelector:
    matchLabels:
      infraenvs.agent-install.openshift.io: sno2
  pullSecretRef:
    name: pull-secret      
  sshAuthorizedKey: ssh-ed25519 XXXXXXXX

