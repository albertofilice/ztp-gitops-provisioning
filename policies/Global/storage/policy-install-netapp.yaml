apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: install-netapp-operator
spec:
  object-templates:
    - complianceType: musthave
      metadataComplianceType: musthave
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: install-netapp-operator
          namespace: '{{ fromClusterClaim "name"}}'
        spec:
          complianceType: musthave
          remediationAction: enforce
          severity: critical
          subscription:
            channel: stable
            name: trident-operator
            namespace: trident
            source: community-operators
            sourceNamespace: openshift-marketplace
            startingCSV: trident-operator.v24.10.1
          upgradeApproval: None
          versions:
            - trident-operator.v24.10.1
--- 
apiVersion: trident.netapp.io/v1
kind: TridentOrchestrator
metadata:
  name: trident
spec:
  imagePullSecrets: []
  IPv6: false
  enableNodePrep: false
  debug: true
  namespace: trident
  k8sTimeout: 30
  kubeletDir: /var/lib/kubelet
  silenceAutosupport: false  
  imageRegistry: "registry.k8s.io/sig-storage"
  autosupportImage: "quay.io/trident-mirror/full/trident-autosupport:24.10"
  tridentImage: "quay.io/trident-mirror/full/trident:24.10.0"