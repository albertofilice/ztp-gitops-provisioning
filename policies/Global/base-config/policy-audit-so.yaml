---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-master-audit
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      - contents:
          source: data:text/plain;charset=utf-8;base64,
        filesystem: root
        mode: 384
        overwrite: true
        path: /etc/audit/rules.d/customaudit.rules
      - contents:
          source: data:text/plain;charset=utf-8;base64,
        filesystem: root
        mode: 416
        overwrite: true
        path: /etc/audit/auditd.conf
      - contents:
          source: data:text/plain;charset=utf-8;base64,W1NlcnZpY2VdClJlc3RhcnQ9b24tZmFpbHVyZQpSZXN0YXJ0UHJldmVudEV4aXRTdGF0dXM9Ngo=
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/systemd/system/auditd.service.d/restart-on-failure.conf  
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-worker-audit
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
      - contents:
          source: data:text/plain;charset=utf-8;base64,
        filesystem: root
        mode: 384
        overwrite: true
        path: /etc/audit/rules.d/customaudit.rules
      - contents:
          source: data:text/plain;charset=utf-8;base64,
        filesystem: root
        mode: 416
        overwrite: true
        path: /etc/audit/auditd.conf
      - contents:
          source: data:text/plain;charset=utf-8;base64,W1NlcnZpY2VdClJlc3RhcnQ9b24tZmFpbHVyZQpSZXN0YXJ0UHJldmVudEV4aXRTdGF0dXM9Ngo=
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/systemd/system/auditd.service.d/restart-on-failure.conf  
---
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
spec:
  audit:
    customRules:
    - group: system:authenticated:oauth
      profile: Default
    profile: None